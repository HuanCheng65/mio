# 澪 LLM Prompt 模板库
# 占位符使用 {variableName} 格式

# ============================================================
# 搜索增强系统 Prompt
# ============================================================

# 搜索结果压缩 Prompt
search_compression_prompt: |
  有人在群里聊到了相关话题,你随手搜了一下。

  你想知道的是:{intent}
  搜索关键词:{query}

  搜索结果:
  {results}

  根据你想知道的,从结果里提取有用的信息,用一两句话概括。
  像随手搜了一眼手机的感觉,不要写太多。
  如果结果确实完全无关(比如搜的是动漫结果全是卖货的),就说"没搜到有用的"。
  只输出那一两句话。
